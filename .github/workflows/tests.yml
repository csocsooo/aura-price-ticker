name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Standard library only, so there is nothing to install. Not plain
      # `unittest discover`: that exits 0 when it finds no tests at all, and
      # a green run that tested nothing is not a pass.
      - name: Run unit tests
        run: python run_tests.py
